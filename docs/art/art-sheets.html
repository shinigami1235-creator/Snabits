<!doctype html><html><body style="margin:0;background:#f6f3ec"><canvas id="c"></canvas>
<script src="../../prototype/chibi.js"></script><script>
/* Art review sheets. Open with #poses, #battle, #bit, #elements, #worn, #effects or #new at the end of the address; add -dark for a grass background. */
const PAL={Blaze:[[226,76,62],[150,40,40],[255,214,90]],Brawl:[[232,140,52],[128,68,30],[255,236,214]],Spark:[[246,206,60],[196,120,34],[255,250,225]],
 Wild:[[118,190,92],[64,120,58],[250,220,110]],Frost:[[120,214,224],[70,130,200],[240,252,255]],Tide:[[70,130,220],[36,70,156],[200,240,255]],
 Venom:[[150,96,206],[72,48,110],[170,240,120]],Charm:[[244,150,190],[150,92,190],[255,240,250]],Stone:[[160,122,86],[96,72,54],[226,206,176]],
 Light:[[244,240,226],[214,180,100],[255,206,90]],Steel:[[170,178,192],[88,96,112],[120,210,240]],Shade:[[78,70,104],[38,34,56],[255,214,74]]};
const mx=(a,b,k)=>a.map((v,i)=>Math.round(v+(b[i]-v)*k)), EL=Object.keys(PAL), pal=e=>({body:PAL[e][0],parts:PAL[e][1],accent:PAL[e][2]});
const FAMS=['Chomp','Squib','Antik','Moko','Pinch','Stilt','Skit','Booly','Quad','Bipped','Flask','Teep','Lern'];
const HOME={Chomp:'Brawl',Squib:'Frost',Antik:'Steel',Moko:'Charm',Pinch:'Blaze',Stilt:'Wild',Skit:'Venom',Booly:'Light',Quad:'Stone',Bipped:'Tide',Flask:'Venom',Teep:'Spark',Lern:'Blaze'};
const LOOKS={
 elements:{rows:['Squib','Pinch','Booly'],cols:EL.map(e=>({label:e,m:{stage:'Mega',el:e}}))},
 worn:{rows:FAMS,cols:[{label:'Plain',m:{}},{label:'Cap, sunglasses, boots',m:{worn:{head:'Cap',face:'Sunglasses',feet:'Boots'}}},
   {label:'Top hat, monocle, mustache',m:{worn:{head:'Top hat',face:'Monocle',mouth:'Mustache'}}},{label:'Crown, angel wings',m:{worn:{head:'Crown',back:'Angel wings'}}},
   {label:'Party hat, bat wings',m:{worn:{head:'Party hat',back:'Bat wings'}}},{label:'Bow, boots',m:{worn:{head:'Bow',feet:'Boots'}}}]},
 effects:{rows:['Chomp','Squib','Pinch','Booly','Bipped','Lern'],cols:['glow','flame','shadow','frost','sparkle'].map(f=>({label:f,m:{fx:f}}))},
 poses:{rows:FAMS.slice(0,8),cols:['idle','walk','run','happy','sad','tired','eat','sleep','sit','dizzy','effort','lean','hover','hurt'].map(q=>({label:q,m:{},pose:q}))},
 battle:{rows:FAMS.slice(0,8),cols:['guard','crouch','tackle','bitewide','chomp','jump','land','punchwind','punch','swipeup','swipedown','cast','push','float','hit','dodge','ko'].map(q=>({label:q,m:{},pose:q}))},
 bit:{rows:FAMS.slice(0,8),cols:['idle','happy','sad','tackle','bitewide','jump','land','hit','ko'].map(q=>({label:q,m:{stage:'Bit'},pose:q}))},
 back:{rows:FAMS.slice(0,8),cols:['idle','walk','tackle','punch','jump','cast','hit','ko'].map(q=>({label:q,m:{back:true,worn:q==='idle'?{head:'Cap',back:'Angel wings'}:{}},pose:q}))},
 ouch:{rows:FAMS.slice(0,8),cols:[{label:'hit Bit',m:{stage:'Bit'},pose:'hit'},{label:'hit Byte',m:{stage:'Byte'},pose:'hit'},{label:'hit Mega',m:{},pose:'hit'},{label:'hurt',m:{},pose:'hurt'},{label:'float',m:{},pose:'float'}]},
 marks:{rows:FAMS.slice(0,8),cols:[{label:'Byte',m:{stage:'Byte'}},...['Stout','Horned','Shelled','Sage','Haloed','Winged'].map(k=>({label:k,m:{stage:'Byte',marks:[k]}})),
   {label:'Mega, Horned, Haloed',m:{marks:['Horned','Haloed']}},{label:'Mega, Sage, Winged',m:{marks:['Sage','Winged']}},{label:'Mega, Shelled, Stout',m:{marks:['Shelled','Stout']}},
   {label:'Back, Shelled, Winged',m:{marks:['Shelled','Winged'],back:true}},{label:'Haloed, top hat',m:{marks:['Horned','Haloed'],worn:{head:'Top hat'}}}]},
 variants:{rows:FAMS.slice(0,8),cols:[{label:'Plain',m:{}},...['Devoted','Pampered','Feral','Bulky','Lean','Champion','Scruffy'].map(v=>({label:v,m:{variant:v}})),
   {label:'Moonlit',m:{variant:'Moonlit'},pf:p=>({...p,body:mx(p.body,[60,70,140],0.45),parts:mx(p.parts,[90,100,170],0.4)})},
   {label:'Wanderer, from Tide',m:{variant:'Wanderer'},pf:p=>({...p,accent:[70,130,220],parts:mx(p.parts,[70,130,220],0.5)})},
   {label:'Feral, Mega, hurt',m:{variant:'Feral'},pose:'hurt'},{label:'Champion, back',m:{variant:'Champion',back:true}}]},
 hybrids:{rows:FAMS.slice(0,8),cols:FAMS.slice(0,8).map(b=>({label:'on '+b+' legs',legs:b,m:{}}))},
 new:{rows:['Pinch','Quad','Bipped','Flask','Teep','Lern'],cols:[{label:'Bit',m:{stage:'Bit'}},{label:'Byte',m:{stage:'Byte'}},{label:'Mega',m:{stage:'Mega'}},{label:'Mega happy',m:{stage:'Mega'},pose:'happy'},{label:'Mega walk',m:{stage:'Mega'},pose:'walk'}]}
};
const KEY=location.hash.slice(1).replace('-dark',''), DARK=/-dark/.test(location.hash), L=LOOKS[KEY]||LOOKS.new, W=KEY==='poses'||KEY==='battle'||KEY==='bit'||KEY==='back'||KEY==='ouch'||KEY==='hybrids'||KEY==='marks'||KEY==='variants'?132:150, H=W, LX=70, TOP=34, c=document.getElementById('c'), d=2;
c.width=(LX+L.cols.length*W)*d; c.height=(TOP+L.rows.length*H)*d; c.style.width=c.width/d+'px';
const x=c.getContext('2d'); x.scale(d,d); if(DARK){ x.fillStyle='#4f7a45'; x.fillRect(0,0,c.width,c.height); } x.font='600 11px sans-serif'; x.textAlign='center'; x.fillStyle=DARK?'#e8f0e0':'#776';
L.cols.forEach((col,i)=>{ const words=col.label.split(', '); words.forEach((w,k)=>x.fillText(w,LX+i*W+W/2,12+k*12)); });
x.textAlign='left';
L.rows.forEach((row,j)=>{ const [fam,rowEl]=row.split(':'); x.fillStyle=DARK?'#e8f0e0':'#776'; x.fillText(row.replace(':',', '),8,TOP+j*H+H/2);
  L.cols.forEach((col,i)=>{ const el=col.m.el||rowEl||HOME[fam]; x.save(); x.translate(LX+i*W,TOP+j*H-16); x.scale(W/200,W/200);
    const F2=col.legs&&col.legs!==fam?(CHIBI.hybrid(fam+'+'+col.legs,fam,col.legs),fam+'+'+col.legs):fam; CHIBI.draw(x,{family:F2,stage:'Mega',marks:[],worn:{},pal:col.pf?col.pf(pal(el)):pal(el),el,...col.m},col.pose||'idle',300+i*130); x.restore(); }); });
</script></body></html>
