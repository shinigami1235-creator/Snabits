<!doctype html><html><head><link rel="stylesheet" href="../../prototype/theme.css"><script src="../../prototype/icons.js"></script>
<style>body{margin:0;padding:18px;font-family:Fredoka,system-ui;width:760px}h1{color:#fff4dc;font-size:22px;margin:0 0 12px}
.g{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.t{background:#f3e4c4;border:2px solid #5a3a22;border-radius:14px;box-shadow:0 4px 0 #5a3a22;padding:12px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;color:#3a2618;font-weight:600;font-size:14px}</style></head>
<body class="theme-wood"><h1>Icons, one set: brown outline, flat fills, one white highlight</h1><div class="g" id="g"></div>
<script>document.getElementById('g').innerHTML=Object.keys(ICONS).map(n=>`<div class="t">${ICON(n,56)}${n}</div>`).join('');</script></body></html>
