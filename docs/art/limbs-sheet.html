<!doctype html><html><body style="margin:0;background:#f6f3ec"><canvas id="c"></canvas>
<script src="../../prototype/chibi.js"></script><script>
const orange={body:[232,140,52],parts:[128,68,30],accent:[255,236,214]};
const D=[['Chomp',orange,'Brawl',{armL:'robot',armR:'slime'},'robot + slime arms'],['Chomp',orange,'Brawl',{armL:'vine',armR:'vine',legL:'vine',legR:'vine'},'vines'],
 ['Chomp',orange,'Brawl',{legL:'light',legR:'shadow'},'light + shadow legs'],['Squib',{body:[96,206,214],parts:[52,104,196],accent:[236,250,255]},'Frost',{legL:'slime',legR:'shadow'},'slime + shadow tentacles'],
 ['Stilt',{body:[118,190,92],parts:[64,120,58],accent:[250,220,110]},'Wild',{legL:'robot',legR:'robot',armL:'vine'},'robot legs, vine arm'],['Booly',{body:[236,232,250],parts:[176,160,220],accent:[255,214,110]},'Light',{armL:'light',armR:'light'},'light arms']];
const W=170,H=190,c=document.getElementById('c'),d=2; c.width=D.length*W*d; c.height=(H+24)*d; c.style.width=c.width/d+'px';
const x=c.getContext('2d'); x.scale(d,d); x.font='600 12px sans-serif';
D.forEach(([fam,pal,el,limbs,label],i)=>{ x.fillStyle='#776'; x.fillText(label,i*W+10,18); x.save(); x.translate(i*W-5,26); x.scale(W/190,W/190);
  CHIBI.draw(x,{family:fam,stage:'Mega',pal,marks:[],el,worn:{},limbs},/arms|vines/.test(label)?'happy':'idle',400); x.restore(); });
</script></body></html>
