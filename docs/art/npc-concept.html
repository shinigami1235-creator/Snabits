<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../prototype/ui.css">
<style>html,body{overflow:auto;height:auto;background:#15161f;margin:0}canvas{display:block}</style></head><body><canvas id="c"></canvas>
<script>const RW=240,RH=180,GROUND=150,HELPX=52,BOWLX=64;</script>
<script src="../../prototype/chibi.js"></script><script src="../../prototype/scenes.js"></script><script src="../../prototype/npcs.js"></script>
<script>
/* Concept sheet for the new people: Kiko the trip guide, Nena at the shop, Dr. Ines and Benji at the lab. Open with #people. */
const c=document.getElementById('c'), d=2, x=c.getContext('2d');
function size(w,h){ c.width=w*d; c.height=h*d; c.style.width=w+'px'; x.setTransform(d,0,0,d,0,0); }
function label(t,X,Y,col='#e9e4f5',al='center',f='600 13px system-ui'){ x.font=f; x.fillStyle=col; x.textAlign=al; x.fillText(t,X,Y); }
function people(){
  size(1340,700); x.fillStyle='#15161f'; x.fillRect(0,0,1340,700);
  label('The new people',24,34,'#ffc93c','left','800 22px system-ui');
  const who=['guide','shop','doc','aide'], faces=['happy','talk','worried','surprised'];
  who.forEach((w,i)=>{ const Y=60+i*150;
    label(NPC[w].name,24,Y+20,NPC[w].tag,'left','800 17px system-ui');
    label({guide:'Trip guide',shop:'Shopkeeper',doc:'Runs the lab',aide:'Lab assistant'}[w],24,Y+40,'#a6a4b8','left','13px system-ui');
    faces.forEach((f,j)=>{ const cv=document.createElement('canvas'); cv.style.width='120px'; document.body.appendChild(cv); Object.defineProperty(cv,'clientWidth',{value:120});
      npcPortrait(cv,w,f); x.save(); x.beginPath(); x.roundRect(150+j*134,Y,120,120,12); x.clip(); x.drawImage(cv,150+j*134,Y,120,120); x.restore(); cv.remove();
      label(f,210+j*134,Y+136,'#8a88a0'); });
  });
  // full bodies next to Tala, to scale
  const gx=720, gy=640; x.fillStyle='#24263a'; x.fillRect(gx-20,gy,600,6);
  label('Full height, to scale with Tala (160 cm)',gx,90,'#e9e4f5','left','700 15px system-ui');
  const H=cm=>cm*1.8;
  talaFull(x,gx+50,gy,H(160),'happy'); label("Tala",gx+50,gy+24);
  npcFull(x,'guide',gx+170,gy,H(165),'happy','stand'); label('Kiko',gx+170,gy+24,NPC.guide.tag);
  npcFull(x,'shop',gx+290,gy,H(150),'happy','wave'); label('Nena',gx+290,gy+24,NPC.shop.tag);
  npcFull(x,'doc',gx+410,gy,H(168),'talk','stand'); label('Dr. Ines',gx+410,gy+24,NPC.doc.tag);
  npcFull(x,'aide',gx+530,gy,H(172),'happy','stand'); label('Benji',gx+530,gy+24,NPC.aide.tag);
}
const views={people};
(views[location.hash.slice(1)]||people)();
document.title='ready';
</script></body></html>
